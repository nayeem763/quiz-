<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>জীববিজ্ঞান MCQ কুইজ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#eef2ff;--bg2:#fdf2f8;--card:#fff;--tx:#1e1b4b;--mu:#6b7280;--bd:#e0e7ff;--pr:#6366f1;--pr2:#ec4899;--ok:#16a34a;--okbg:#dcfce7;--no:#dc2626;--nobg:#fee2e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0f1020;--bg2:#1a0f1f;--card:#1b1c36;--tx:#eef;--mu:#a5a8c8;--bd:#2e3060;--okbg:#0f3a22;--nobg:#451a1a}}
:root[data-theme="dark"]{--bg1:#0f1020;--bg2:#1a0f1f;--card:#1b1c36;--tx:#eef;--mu:#a5a8c8;--bd:#2e3060;--okbg:#0f3a22;--nobg:#451a1a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;color:var(--tx);background:linear-gradient(135deg,var(--bg1),var(--bg2)) fixed}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 40px}
.top{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px}
.chip{background:linear-gradient(90deg,var(--pr),var(--pr2));color:#fff;padding:4px 14px;border-radius:99px;font-size:14px}
.bar{height:8px;background:var(--bd);border-radius:9px;margin:12px 0 18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:9px;transition:width .4s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:22px;padding:22px 18px;box-shadow:0 10px 30px rgba(99,102,241,.15);animation:up .35s}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
h2{font-size:19px;line-height:1.55;margin:0 0 16px}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--tx);background:var(--card);border:2px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .15s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--pr);transform:translateY(-2px)}
.opt b{flex:none;width:28px;height:28px;border-radius:50%;background:var(--bd);display:grid;place-items:center;font-size:14px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.ok b{background:var(--ok);color:#fff}
.opt.no{background:var(--nobg);border-color:var(--no)}.opt.no b{background:var(--no);color:#fff}
.ans{margin-top:6px;padding:12px 14px;border-radius:14px;font-weight:500;line-height:1.5;animation:up .3s}
.ans.ok{background:var(--okbg);color:var(--ok)}.ans.no{background:var(--nobg);color:var(--no)}
.btn{margin-top:16px;width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-size:17px;font-weight:600;color:#fff;background:linear-gradient(90deg,var(--pr),var(--pr2));cursor:pointer}
.big{font-size:64px;text-align:center}.score{font-size:40px;font-weight:700;text-align:center;margin:6px 0}.msg{text-align:center;color:var(--mu);margin-bottom:6px}
.hide{display:none}
</style>
</head>

  <div id="app"></div>
</div>

let i=0,s=0;
const app=document.getElementById('app'),sc=document.getElementById('sc'),pg=document.getElementById('pg');
function show(){

  pg.style.width=(i/Q.length*100)+'%';

  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
}
function pick(k){
  const [q,o,c]=Q[i];
  const bs=app.querySelectorAll('.opt');
  bs.forEach(b=>b.disabled=true);
  bs[c].classList.add('ok');
  const right=k===c;
  if(right)s++; else bs[k].classList.add('no');
  sc.textContent='স্কোর: '+bn(s);
  const last=i===Q.length-1;
  document.getElementById('fb').innerHTML=`<div class="ans ${right?'ok':'no'}">${right?'✅ সঠিক উত্তর!':'❌ ভুল উত্তর!'}<br>সঠিক উত্তর: ${L[c]}. ${o[c]}</div><button class="btn" id="nx">${last?'ফলাফল দেখো 🏆':'পরবর্তী প্রশ্ন →'}</button>`;
  document.getElementById('nx').onclick=()=>{i++;last?end():show()};
}
function end(){
  pg.style.width='100%';
